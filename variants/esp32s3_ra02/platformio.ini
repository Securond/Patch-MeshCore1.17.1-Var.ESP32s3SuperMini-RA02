[ESP32S3_RA02]
extends = esp32_base
board = esp32-s3-devkitm-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304  ; Явно указать максимальный размер 4MB (байты)
board_build.flash_mode = qio          ; Убедиться в правильности режима Flash
board_build.partitions = default.csv  ; Использовать таблицу разделов по умолчанию для 4MB
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32s3_ra02
  -D ESP32_S3_RA02
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D PIN_BOARD_SDA=4 ; Дисплей SDA
  -D PIN_BOARD_SCL=5 ; Дисплей SCL
  -D PIN_USER_BTN=3 ; Пин кнопки
  -D P_LORA_DIO_0=8
  -D P_LORA_DIO_1=7
  -D P_LORA_NSS=10
  -D P_LORA_RESET=9
  -D P_LORA_SCLK=12
  -D P_LORA_MISO=13
  -D P_LORA_MOSI=11
  -D RADIO_CLASS=CustomSX1278
  -D WRAPPER_CLASS=CustomSX1278Wrapper
  -D LORA_FREQ=433.000
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=17
  -D SX127X_CURRENT_LIMIT=120
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32s3_ra02>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
[env:ESP32S3_RA02_repeater]
extends = ESP32S3_RA02
build_flags =
  ${ESP32S3_RA02.build_flags}
  -D ADVERT_NAME='"S3-RA02 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${ESP32S3_RA02.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${ESP32S3_RA02.lib_deps}
  ${esp32_ota.lib_deps}

[env:ESP32S3_RA02_terminal_chat]
extends = ESP32S3_RA02
build_flags =
  ${ESP32S3_RA02.build_flags}
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=1
build_src_filter = ${ESP32S3_RA02.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${ESP32S3_RA02.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32S3_RA02_companion_radio_usb]
extends = ESP32S3_RA02
build_flags =
  ${ESP32S3_RA02.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
build_src_filter = ${ESP32S3_RA02.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ESP32S3_RA02.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32S3_RA02_companion_radio_ble]
extends = ESP32S3_RA02
build_flags =
  ${ESP32S3_RA02.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${ESP32S3_RA02.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ESP32S3_RA02.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32S3_RA02_companion_radio_wifi]
extends = ESP32S3_RA02
build_flags = 
   ${ESP32S3_RA02.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=400
  -D MAX_GROUP_CHANNELS=20
  -D DISPLAY_CLASS=SSD1306Display
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${ESP32S3_RA02.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ESP32S3_RA02.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32S3_RA02_kiss_modem]
extends = ESP32S3_RA02
build_src_filter = ${ESP32S3_RA02.build_src_filter}
  +<../examples/kiss_modem/>